name: saas-analytics
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [saas_net]
  pgadmin:
    image: dpage/pgadmin4:7.7
    env_file: .env
    ports:
      - "${PGADMIN_HOST_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks: [saas_net]

volumes:
  postgres_data:
  pgadmin_data:

networks:
  saas_net:
